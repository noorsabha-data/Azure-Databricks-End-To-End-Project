# This is a Declarative Automation Bundle definition for databricks_ete_bundle_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_ete_bundle_project
  uuid: 885c528d-8ccd-4e86-b6d8-72881f954c6e

include:
  - resources/*.yml
  - resources/*/*.yml


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://adb-7405618178397965.5.azuredatabricks.net/
    
  prod:
    mode: production
    workspace:
      host: https://adb-7405618178397965.5.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/shaikhsalim124@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shaikhsalim124@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - user_name: shaikhsalim124@gmail.com
        level: CAN_MANAGE
