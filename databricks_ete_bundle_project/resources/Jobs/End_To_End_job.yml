resources:
  jobs:
    End_To_End_Pipeline:
      name: End_To_End_Pipeline
      tasks:
        - task_key: Parameters
          notebook_task:
            notebook_path: ../../src/notebooks/parameters.ipynb
            source: WORKSPACE
          environment_key: Parameters_environment
        - task_key: Bronze_Autoloader
          depends_on:
            - task_key: Parameters
          for_each_task:
            inputs: "{{tasks.Parameters.values.output_datasets}}"
            task:
              task_key: Bronze_Autoloader_iteration
              notebook_task:
                notebook_path: ../../src/notebooks/Bronze
                  Layer.ipynb
                base_parameters:
                  file_name: "{{input.file_name}}"
                source: WORKSPACE
              environment_key: Parameters_environment
        - task_key: silver_customers
          depends_on:
            - task_key: Bronze_Autoloader
          notebook_task:
            notebook_path: ../../src/notebooks/Silver_Customers.ipynb
            source: WORKSPACE
        - task_key: silver_orders
          depends_on:
            - task_key: Bronze_Autoloader
          notebook_task:
            notebook_path: ../../src/notebooks/Silver_Orders.ipynb
            source: WORKSPACE
        - task_key: silver_products
          depends_on:
            - task_key: Bronze_Autoloader
          notebook_task:
            notebook_path: ../../src/notebooks/Silver_Products.ipynb
            source: WORKSPACE
        - task_key: gold_customers
          depends_on:
            - task_key: silver_products
            - task_key: silver_customers
            - task_key: silver_orders
          notebook_task:
            notebook_path: ../../src/notebooks/Gold_Customers.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Parameters_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED

